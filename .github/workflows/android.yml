name: App Android nativa (APK y AAB)

# La app nativa de Cosland (carpeta mobile/, React Native con Expo).
# Se lanza a mano: pestaña Actions → "App Android nativa (APK y AAB)" → Run workflow.
# Con los secretos de firma genera el APK y el AAB listos para Play Store.
# Sin ellos genera un APK firmado con una llave de prueba, para instalar en tu teléfono.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Dirección de Cosland, sin https:// (ej. cosland.app)"
        required: true
        type: string
      version_name:
        description: "Versión visible (ej. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Número de versión: súbelo en 1 cada vez que subas a Play"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      TWA_HOST: ${{ inputs.host }}
      EXPO_PUBLIC_API_URL: https://${{ inputs.host }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: cosland
    steps:
      - uses: actions/checkout@v4

      - name: Revisar datos
        run: |
          if ! [[ "$TWA_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::La dirección debe ir sin https:// ni barras, por ejemplo cosland.app"; exit 1
          fi
          if ! [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::El número de versión debe ser un entero (1, 2, 3...)"; exit 1
          fi
          if ! [[ "$APP_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::La versión visible debe ser como 1.0.0"; exit 1
          fi
          code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "https://$TWA_HOST/api/health" || true)
          if [ "$code" != "200" ]; then
            echo "::warning::https://$TWA_HOST/api/health respondió $code. Revisa que la dirección sea la de Cosland y que el servidor esté arriba."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Generar el proyecto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Preparar la llave de firma
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cosland.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cosland.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK y AAB para Play Store
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Compilar APK de prueba (sin llave de firma)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Resumen y huella de la llave
        run: |
          {
            echo "## Cosland para Android (app nativa)"
            echo "- Servidor: \`https://$TWA_HOST\`"
            echo "- Versión: $APP_VERSION_NAME ($APP_VERSION_CODE)"
            if [ "$HAS_KEY" = "true" ]; then
              fp=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
              echo "- Firma: tu llave de subida. El archivo \`.aab\` es el que se sube a Play Store."
              echo ""
              echo "### Huella SHA-256 de tu llave"
              echo "\`$fp\`"
              echo ""
              echo "Ponla en Railway en la variable \`ANDROID_SHA256\` para que los enlaces de Cosland abran en la app. Cuando Play Console te dé la huella de su llave de firma, agrégala a la misma variable separada por una coma."
            else
              echo "- Firma: de prueba. Este APK sirve para instalar en tu teléfono, no para Play Store."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cosland-android-${{ inputs.version_name }}
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
