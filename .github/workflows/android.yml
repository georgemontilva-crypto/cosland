name: App Android nativa (APK y AAB)

# La app nativa de Cosland (carpeta mobile/, React Native con Expo).
# Se compila sola cada vez que cambia la app en main. La dirección del servidor y la versión
# salen de mobile/release.json. También se puede lanzar a mano desde la pestaña Actions.
# Con los secretos de firma genera el APK y el AAB listos para Play Store.
# Sin ellos genera un APK firmado con una llave de prueba, para instalar en tu teléfono.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      host:
        description: "Dirección de Cosland sin https:// (vacío = la de mobile/release.json)"
        required: false
        type: string
      version_name:
        description: "Versión visible, ej. 1.0.0 (vacío = la de mobile/release.json)"
        required: false
        type: string
      version_code:
        description: "Número de versión entero (vacío = el de mobile/release.json)"
        required: false
        type: string

# Si llega un cambio nuevo mientras compila, se queda solo con el último
concurrency:
  group: android-nativa
  cancel-in-progress: true

permissions:
  contents: write   # para publicar el APK en Releases (la descarga pública de la web)

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      INPUT_HOST: ${{ inputs.host }}
      INPUT_VERSION_NAME: ${{ inputs.version_name }}
      INPUT_VERSION_CODE: ${{ inputs.version_code }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: cosland
    steps:
      - uses: actions/checkout@v4

      - name: Datos de la versión
        run: |
          host="${INPUT_HOST:-$(jq -r .host mobile/release.json)}"
          name="${INPUT_VERSION_NAME:-$(jq -r .versionName mobile/release.json)}"
          code="${INPUT_VERSION_CODE:-$(jq -r .versionCode mobile/release.json)}"
          {
            echo "TWA_HOST=$host"
            echo "EXPO_PUBLIC_API_URL=https://$host"
            echo "APP_VERSION_NAME=$name"
            echo "APP_VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      - name: Revisar datos
        run: |
          if ! [[ "$TWA_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::La dirección debe ir sin https:// ni barras, por ejemplo cosland.app"; exit 1
          fi
          if ! [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::El número de versión debe ser un entero (1, 2, 3...)"; exit 1
          fi
          if ! [[ "$APP_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::La versión visible debe ser como 1.0.0"; exit 1
          fi
          # La app queda apuntando a esta dirección: si no es Cosland, el APK no serviría. Se reintenta por si el servidor está desplegando.
          ok=""
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 20 "https://$TWA_HOST/api/health" || true)
            if echo "$body" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::https://$TWA_HOST/api/health no responde como Cosland. Pon la dirección correcta en mobile/release.json (campo host) y vuelve a subir."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      # Avisos con la app cerrada (Firebase). Sin el secreto GOOGLE_SERVICES_JSON la app se compila igual, sin esa parte.
      - name: Preparar Firebase
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Falta el secreto GOOGLE_SERVICES_JSON: la app no recibirá avisos estando cerrada."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("google-services.json", "utf8"));
            const ok = (j.client || []).some((c) => c.client_info?.android_client_info?.package_name === "com.cosland.app");
            if (!ok) { console.error("::error::El google-services.json no es de la app com.cosland.app. Revisa el nombre del paquete en Firebase."); process.exit(1); }
            console.log("Firebase listo: proyecto " + j.project_info.project_id);
          '

      - name: Generar el proyecto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Preparar la llave de firma
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cosland.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cosland.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK y AAB para Play Store
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Compilar APK de prueba (sin llave de firma)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Resumen y huella de la llave
        run: |
          {
            echo "## Cosland para Android (app nativa)"
            echo "- Servidor: \`https://$TWA_HOST\`"
            echo "- Versión: $APP_VERSION_NAME ($APP_VERSION_CODE)"
            if [ "$HAS_KEY" = "true" ]; then
              fp=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
              echo "- Firma: tu llave de subida. El archivo \`.aab\` es el que se sube a Play Store."
              echo ""
              echo "### Huella SHA-256 de tu llave"
              echo "\`$fp\`"
              echo ""
              echo "Ponla en Railway en la variable \`ANDROID_SHA256\` para que los enlaces de Cosland abran en la app. Cuando Play Console te dé la huella de su llave de firma, agrégala a la misma variable separada por una coma."
            else
              echo "- Firma: de prueba. Este APK sirve para instalar en tu teléfono, no para Play Store."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # El APK queda siempre en la misma dirección pública; el botón "Descargar para Android" de la web apunta ahí:
      # https://github.com/<repo>/releases/download/android/cosland.apk
      - name: Publicar el APK para descargar
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "$RUNNER_TEMP/cosland.apk"
          mb=$(( ($(stat -c %s "$RUNNER_TEMP/cosland.apk") + 524288) / 1048576 ))
          notes="Cosland para Android, versión $APP_VERSION_NAME ($APP_VERSION_CODE). Compilada el $(date -u +%Y-%m-%d) desde ${GITHUB_SHA::7}. Pesa $mb MB."
          gh release view android >/dev/null 2>&1 || gh release create android --title "Cosland para Android" --notes "$notes"
          gh release upload android "$RUNNER_TEMP/cosland.apk" --clobber
          gh release edit android --notes "$notes"
          {
            echo ""
            echo "### Descarga pública"
            echo "- APK: $mb MB"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/download/android/cosland.apk"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK publicado: $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: cosland-android-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
