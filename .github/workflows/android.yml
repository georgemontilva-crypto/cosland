name: App Android (APK y AAB)

# Se lanza a mano: pestaña Actions → "App Android (APK y AAB)" → Run workflow.
# Con los secretos de firma genera el APK y el AAB listos para Play Store.
# Sin ellos genera un APK de prueba para instalar en tu teléfono.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Dirección de la web, sin https:// (ej. cosland.app)"
        required: true
        type: string
      version_name:
        description: "Versión visible (ej. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Número de versión: súbelo en 1 cada vez que subas a Play"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWA_HOST: ${{ inputs.host }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: cosland
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Revisar datos
        run: |
          if ! [[ "$TWA_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::La dirección debe ir sin https:// ni barras, por ejemplo cosland.app"; exit 1
          fi
          if ! [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::El número de versión debe ser un entero (1, 2, 3...)"; exit 1
          fi
          code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "https://$TWA_HOST/manifest.webmanifest" || true)
          if [ "$code" != "200" ]; then
            echo "::warning::https://$TWA_HOST/manifest.webmanifest respondió $code. Revisa que la dirección sea la de Cosland."
          fi

      - name: Preparar la llave de firma
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cosland.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cosland.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK y AAB firmados
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PtwaHost="$TWA_HOST" -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE"

      - name: Compilar APK de prueba (sin llave de firma)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PtwaHost="$TWA_HOST" -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE"

      - name: Resumen y huella de la llave
        run: |
          {
            echo "## Cosland para Android"
            echo "- Dirección: \`https://$TWA_HOST\`"
            echo "- Versión: $APP_VERSION_NAME ($APP_VERSION_CODE)"
            if [ "$HAS_KEY" = "true" ]; then
              fp=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
              echo "- Firma: llave de subida de Cosland"
              echo ""
              echo "### Huella SHA-256 de tu llave"
              echo "\`$fp\`"
              echo ""
              echo "Ponla en Railway en la variable \`ANDROID_SHA256\`. Cuando Play Console te dé la huella de su llave de firma, agrégala a la misma variable separada por una coma."
            else
              echo "- Firma: de prueba. Este APK sirve para instalar en tu teléfono, no para Play Store."
              echo ""
              echo "Verás la barra de direcciones arriba: desaparece con la versión firmada y la variable \`ANDROID_SHA256\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cosland-android-${{ inputs.version_name }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
