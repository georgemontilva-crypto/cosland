<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf1dc" />
    <title>Sin conexión | Cosland</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fbf1dc; color: #2a211c;
        font-family: ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif; text-align: center; padding: 1.5rem; }
      img { width: 7rem; }
      h1 { font-size: 1.75rem; margin: 1.25rem 0 0.5rem; }
      p { color: #6b5a4e; max-width: 22rem; margin: 0 auto 1.5rem; line-height: 1.5; }
      button { font: inherit; font-weight: 700; padding: 0.8rem 1.6rem; border-radius: 999px; border: 1.5px solid #2a211c; background: #2a211c; color: #fbf1dc; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/gato-ink.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Revisa tu internet y vuelve a intentarlo. Tus publicaciones y mensajes siguen a salvo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
